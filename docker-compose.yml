services:
  db:
    image: postgres:16

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chisosecure

    volumes:
      - chisosecure_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d chisosecure"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/chisosecure
      CHISOSECURE_SECRET_KEY: local-development-secret-change-me

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped


volumes:
  chisosecure_postgres_data: